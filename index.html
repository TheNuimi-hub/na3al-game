          box.appendChild(l);

        window.addEventListener('error', function (e) { log('ERROR: ' + (e.message || 'script error') + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno, true); }, true);

    <script>
      // If the game cannot start, say so instead of leaving a black screen.
      (function () {
        function fail(text) {
          var b = document.getElementById('boot');
          var m = document.getElementById('boot-msg');
          if (b && m && !b.classList.contains('out')) m.textContent = text;
        }
        window.addEventListener('error', function (e) { if (e.target === window) fail('حصلت مشكلة بالتحميل. حدّث الصفحة، وإذا تكررت جرّب متصفحاً ثانياً.'); }, true); // script errors only, not a missing picture
        setTimeout(function () { fail('التحميل بطيء. تأكد من الاتصال أو حدّث الصفحة.'); }, 15000);
      })();
    </script>
